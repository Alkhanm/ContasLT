services:
  db:
    image: postgres:17-alpine
    container_name: contaslt-db
    environment:
      POSTGRES_DB: contaslt
      POSTGRES_USER: contaslt
      POSTGRES_PASSWORD: contaslt
    ports:
      - "5432:5432"
    volumes:
      - contaslt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contaslt -d contaslt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  contaslt-pgdata:

# Profile "cds": usado SO no build da imagem Docker, na rodada de treino que gera o arquivo de classes compartilhadas
# (-XX:ArchiveClassesAtExit). O contexto sobe e sai em seguida (spring.context.exit=onRefresh), sem banco disponivel:
# tudo o que tocaria o Postgres na inicializacao fica desligado.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.datasource.hikari.initialization-fail-timeout=-1
app.spa.dir=

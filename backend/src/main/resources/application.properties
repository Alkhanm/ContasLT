spring.application.name=contaslt

# Host, porta, banco e sslmode em variaveis separadas (mesmo padrao do Fimagion): foi a forma que funcionou no
# Railway com o Supabase. sslmode padrao "disable" para o Postgres local; em producao, DB_SSLMODE=require.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:contaslt}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER:contaslt}
spring.datasource.password=${DB_PASSWORD:contaslt}
# Pool pequeno: o app é de uma pessoa e o pooler do Supabase (plano gratuito) limita as conexoes.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
# Fecha a conexao antes que o pooler a recicle por baixo (evita "connection closed unexpectedly").
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# 15 MB cobre qualquer foto; o limite maior e para restaurar um backup (zip com todas as fotos).
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

server.port=${PORT:8080}
server.error.include-message=always
# Atras do proxy do Railway (TLS termina la): respeita X-Forwarded-* para montar URLs e esquema corretos.
server.forward-headers-strategy=native
# Encerra pedidos em andamento antes de parar (deploy sem erro 502 no meio de um upload).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Poucas threads: servidor de 0,5 vCPU e um usuario; cada thread custa pilha e memoria.
server.tomcat.threads.max=${TOMCAT_THREADS:16}
server.tomcat.threads.min-spare=2
# Sem agente JMX no container: economiza memoria e threads.
spring.jmx.enabled=false
# JSON comprimido (gzip) acima de 1 KB: menos bytes no 4G do celular por quase nada de CPU.
server.compression.enabled=true
server.compression.min-response-size=1KB

management.endpoints.web.exposure.include=health

# Chave HS256 (minimo 32 bytes). Troque em producao via JWT_SECRET.
app.jwt.secret=${JWT_SECRET:contaslt-dev-secret-change-me-please-0123456789}
app.jwt.expiration=${JWT_EXPIRATION:P7D}
# Origens permitidas (aceita padroes: host com * e porta [*]). Em producao, informe o dominio real via CORS_ORIGINS.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*],http://10.*.*.*:[*],http://172.*.*.*:[*],http://100.*.*.*:[*]}

# Leitura de comprovantes (foto de cupom fiscal) com um modelo de visao: ollama (local), openai (API compativel
# com OpenAI: OpenAI, Gemini, Groq, OpenRouter...), worker (fila: um worker no computador do usuario, rodando
# `java -jar contaslt.jar --worker`, puxa as fotos e le com o Ollama local) ou none (desligado). Em producao o padrao e worker.
app.receipts.provider=${RECEIPT_PROVIDER:ollama}
# Recursos premium (leitura de comprovantes, backup) so para usuarios com premium=TRUE na tabela users.
# PREMIUM_ENFORCE=false libera para todos (ex.: uso local).
app.premium.enforce=${PREMIUM_ENFORCE:${RECEIPT_REQUIRE_PREMIUM:true}}
# Segredo compartilhado com o worker (X-Worker-Token). Sem ele, /api/worker/** responde 401.
app.worker.token=${WORKER_TOKEN:}
app.ollama.url=${OLLAMA_URL:http://localhost:11434}
app.ollama.model=${OLLAMA_MODEL:qwen3.5:9b-q8_0}
app.ollama.timeout=${OLLAMA_TIMEOUT:PT3M}
app.openai.url=${OPENAI_URL:https://api.openai.com/v1}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.openai.timeout=${OPENAI_TIMEOUT:PT2M}
# Imagens de comprovantes: pasta local por padrao; com SUPABASE_URL definida, bucket privado do Supabase Storage
# (o disco do Railway e apagado a cada deploy).
app.storage.dir=${STORAGE_DIR:./data}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.key=${SUPABASE_SERVICE_KEY:}
app.storage.supabase.bucket=${SUPABASE_BUCKET:receipts}
# Build do frontend servido pelo proprio backend (modo producao). Vazio em dev: o Vite serve o frontend.
app.spa.dir=${SPA_DIR:}

spring.application.name=contaslt

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contaslt}
spring.datasource.username=${DB_USER:contaslt}
spring.datasource.password=${DB_PASSWORD:contaslt}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

server.port=${PORT:8080}
server.error.include-message=always

management.endpoints.web.exposure.include=health

# Chave HS256 (minimo 32 bytes). Troque em producao via JWT_SECRET.
app.jwt.secret=${JWT_SECRET:contaslt-dev-secret-change-me-please-0123456789}
app.jwt.expiration=${JWT_EXPIRATION:P7D}
# Origens permitidas (aceita padroes: host com * e porta [*]). Em producao, informe o dominio real via CORS_ORIGINS.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*],http://10.*.*.*:[*],http://172.*.*.*:[*],http://100.*.*.*:[*]}

# Leitura de comprovantes (foto de cupom fiscal) com um modelo de visao local via Ollama.
app.ollama.url=${OLLAMA_URL:http://localhost:11434}
app.ollama.model=${OLLAMA_MODEL:qwen3.5:9b-q8_0}
app.ollama.timeout=${OLLAMA_TIMEOUT:PT3M}
# Pasta das imagens de comprovantes.
app.storage.dir=${STORAGE_DIR:./data}
# Build do frontend servido pelo proprio backend (modo producao). Vazio em dev: o Vite serve o frontend.
app.spa.dir=${SPA_DIR:}

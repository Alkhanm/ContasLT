# Profile "prod": ativar no Railway com SPRING_PROFILES_ACTIVE=prod.
# Sem valor padrao de proposito: subir sem JWT_SECRET ou sem CORS_ORIGINS falha na hora, em vez de rodar inseguro.
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ORIGINS}
# Nao ha Ollama no servidor; ligue com RECEIPT_PROVIDER=openai + OPENAI_API_KEY (e OPENAI_URL/OPENAI_MODEL se nao for a OpenAI).
app.receipts.provider=${RECEIPT_PROVIDER:none}
# Frontend fica no Firebase Hosting; o backend nao serve arquivos estaticos.
app.spa.dir=
# Mensagens de erro internas nao vao para o cliente.
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

spring.datasource.url=jdbc:h2:mem:contaslt;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=15MB
app.jwt.secret=test-secret-test-secret-test-secret-test-secret
app.jwt.expiration=PT1H
app.cors.allowed-origins=http://localhost:[*],http://127.0.0.1:[*],http://100.*.*.*:[*]
app.receipts.provider=ollama
app.ollama.url=http://localhost:1
app.ollama.model=test
app.ollama.timeout=PT5S
app.storage.dir=${java.io.tmpdir}/contaslt-test-storage

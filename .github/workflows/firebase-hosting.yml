# Publica o frontend no Firebase Hosting a cada push na main que mexa no frontend.
# Precisa do secret FIREBASE_SERVICE_ACCOUNT_CONTASLT (JSON da service account), gerado por
# `firebase init hosting:github` ou criado à mão no console do GCP (papel "Firebase Hosting Admin").
# O backend não passa por aqui: o Railway faz o deploy sozinho a partir do GitHub (pasta backend/).
name: Deploy do frontend (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build (usa frontend/.env.production)
        working-directory: frontend
        run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTASLT }}
          channelId: live
          projectId: contaslt
          entryPoint: frontend
